<!DOCTYPE html>
<html lang="de">

<head>
	<script src="https://cdn.tailwindcss.com"></script>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="theme-color" content="#000000">
	<!--
      manifest.json provides metadata used when your web app is added to the
      homescreen on Android. See https://developers.google.com/web/fundamentals/engage-and-retain/web-app-manifest/

	<link rel="manifest" href="%PUBLIC_URL%/manifest.json">
	<link rel="icon" type="image/png" sizes="512x512" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon.png" /> 
	<!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
	<title>Yagibasan Capital – Werte für Generationen</title>
    <meta name="description" content="Finanzielle Bildung und langfristiger Vermögensaufbau mit Weitblick: Yagibasan Capital schafft Werte für heute und für kommende Generationen." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Burak Yagibasan" />
    <link rel="canonical" href="https://yagibasan-capital.de/" />

    <!-- Open Graph (WhatsApp, Instagram, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:site_name" content="Yagibasan Capital" />
    <meta property="og:title" content="Yagibasan Capital – Werte für Generationen" />
    <meta property="og:description" content="Finanzielle Bildung und langfristiger Vermögensaufbau mit Weitblick: Yagibasan Capital schafft Werte für heute und für kommende Generationen." />
    <meta property="og:url" content="https://yagibasan-capital.de/" />
    <meta property="og:image" content="https://yagibasan-capital.de/YAGIBASAN_CAPITAL_Gesamtes_Logo_Verlauf_HighRes.png" />

    <!-- X (Twitter) Vorschau -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@BurakYagibasan" />
    <meta name="twitter:title" content="Yagibasan Capital – Werte für Generationen" />
    <meta name="twitter:description" content="Finanzielle Bildung und langfristiger Vermögensaufbau mit Weitblick: Yagibasan Capital schafft Werte für heute und für kommende Generationen." />
    <meta name="twitter:image" content="https://yagibasan-capital.de/YAGIBASAN_CAPITAL_Gesamtes_Logo_Verlauf_HighRes.png" />

    <!-- Strukturierte Daten für Google (Marke & Gründer) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "Yagibasan Capital",
        "alternateName": "Yagibasan Capital – Strategic Financial Mentoring",
        "url": "https://yagibasan-capital.de/",
        "logo": "https://yagibasan-capital.de/YAGIBASAN_CAPITAL_Gesamtes_Logo_Verlauf_HighRes.png",
        "description": "Finanzielle Bildung und langfristiger Vermögensaufbau mit Weitblick: Yagibasan Capital schafft Werte für heute und für kommende Generationen.",
        "founder": {
          "@type": "Person",
          "name": "Burak Yagibasan"
        },
        "sameAs": [
          "https://www.instagram.com/yagibasancapital/",
          "https://x.com/BurakYagibasan"
        ]
      }
    </script>
</head>
